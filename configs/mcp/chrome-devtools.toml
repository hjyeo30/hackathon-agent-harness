# Optional diagnostic tool, not a default second browser driver.
[mcp_servers.hackathon_devtools]
command = "npx"
args = ["--yes", "chrome-devtools-mcp@1.12.0", "--headless", "--isolated", "--no-usage-statistics", "--no-performance-crux"]
startup_timeout_sec = 30

[mcp_servers.hackathon_devtools.env]
CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS = "1"
